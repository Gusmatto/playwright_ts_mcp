name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Origin under test. Set the BASE_URL repository variable to point at another environment.
  BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      # API tests use Playwright's request context only, so no browser is installed.
      - name: Run API tests
        run: npm run test:api
      - name: Job summary
        if: always()
        run: .github/scripts/job-summary.sh "API tests"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NON-BLOCKING ON PURPOSE. These tests drive a live third-party site
    # (automationexercise.com) that we do not control: ad iframes, slow responses and
    # outages cause failures unrelated to our code. Until the suite has a low flaky
    # rate, a UI failure must not block merges. It stays visible: the job shows red,
    # the job summary lists what failed, and the report and traces are uploaded.
    # TODO: remove `continue-on-error` (and require this job in branch protection)
    # once the flaky rate is low.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Runs the `setup` project first (seeds an account, saves the session) and the
      # `cleanup` project last (deletes the account), even when UI tests fail.
      - name: Run UI tests
        run: npm run test:ui
      - name: Job summary
        if: always()
        run: .github/scripts/job-summary.sh "UI tests (non-blocking)"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
